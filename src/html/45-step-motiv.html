    <div data-step-pane="motiv">

        <div id="props"></div>

      <details class="sec fold" id="pageSec" open>
        <summary><h2 data-i18n="page.title">Blatt</h2><span class="sum" id="pgSummary"></span><span class="chev" data-icon="chevron"></span></summary>
