    <div data-step-pane="plot" hidden>
      <section class="sec plot-main" id="plotSec" aria-labelledby="plotTitle">
        <h2 id="plotTitle" data-i18n="plot.title">Bereit zum Plotten?</h2>
        <div id="preflightBox"><ul class="checks" id="preflight" data-i18n-attr="aria-label:plot.pre.aria" aria-label="Vorab-Check"></ul></div>
        <div id="plotBtns"></div>
        <p class="hint" id="plotHint" hidden></p>
        <div class="plot-prog" id="progWrap" hidden>
          <div class="pct" id="progPct" aria-hidden="true"></div>
          <div class="bar"><i id="progBar"></i></div>
          <div class="prog" role="status"><span id="progL"></span><span id="progR"></span></div>
          <div class="live" id="liveRow" hidden>
            <p class="hint" id="liveInfo" aria-live="off" hidden></p>
            <label class="check"><input type="checkbox" id="followPen"><span data-i18n="plot.follow">Ansicht folgt dem Stift</span></label>
          </div>
        </div>
        <div id="plotNotes"></div>
      </section>
      <details class="sec fold" id="advSec">
        <summary><h2 data-i18n="plot.adv.title">Erweitert</h2><span class="sum" data-i18n="plot.adv.sum">Tempo, Optimierung, G-Code</span><span class="chev" data-icon="chevron"></span></summary>
        <div class="sub-sec">
          <h3 data-i18n="plot.speed.title">Tempo</h3>
          <div class="field"><label class="lbl" for="s_drawF"><span data-i18n="plot.speed.draw">Zeichnen</span><small data-i18n="plot.speed.drawHint">Stift unten</small></label><div class="inp"><input id="s_drawF" type="number" step="100" min="100"><em data-i18n="unit.mmmin">mm/min</em></div></div>
          <div class="field"><label class="lbl" for="s_travelF"><span data-i18n="plot.speed.travel">Leerfahrt</span><small data-i18n="plot.speed.travelHint">Stift oben</small></label><div class="inp"><input id="s_travelF" type="number" step="500" min="500"><em data-i18n="unit.mmmin">mm/min</em></div></div>
          <div class="field"><label class="lbl" for="s_penDelay"><span data-i18n="plot.speed.delay">Pause nach dem Absenken</span><small data-i18n="plot.speed.delayHint">Für Tusche und Pinselstifte</small></label><div class="inp"><input id="s_penDelay" type="number" step="50" min="0"><em data-i18n="unit.ms">ms</em></div></div>
        </div>
        <div class="sub-sec">
          <h3 data-i18n="plot.opt.title">Optimierung</h3>
          <label class="check"><input type="checkbox" id="s_optimize"><span><span data-i18n="plot.opt.order">Reihenfolge optimieren</span><small data-i18n="plot.opt.orderHint">Kürzeste Leerfahrten</small></span></label>
          <label class="check"><input type="checkbox" id="s_reverse"><span data-i18n="plot.opt.reverse">Linien bei Bedarf rückwärts zeichnen</span></label>
          <div class="field"><label class="lbl" for="s_joinTol"><span data-i18n="plot.opt.join">Verbinden bis</span><small data-i18n="plot.opt.joinHint">Der Stift bleibt unten, wenn Linien so nah beieinander enden</small></label><div class="inp"><input id="s_joinTol" type="number" step="0.05" min="0"><em data-i18n="unit.mm">mm</em></div></div>
          <div class="field"><label class="lbl" for="s_simplify"><span data-i18n="plot.opt.simplify">Vereinfachen</span><small data-i18n="plot.opt.simplifyHint">Entfernt Punkte unterhalb dieser Abweichung</small></label><div class="inp"><input id="s_simplify" type="number" step="0.01" min="0"><em data-i18n="unit.mm">mm</em></div></div>
        </div>
        <div class="sub-sec">
          <h3 data-i18n="gcode.title">G-Code</h3>
          <p class="hint" data-i18n-html="gcode.hint">Für andere Sender (z.&nbsp;B. gcode-cli, UGS) oder zum Prüfen. Zwischen den Ebenen steht <code>M0</code> für den Stiftwechsel.</p>
          <div class="row"><button class="btn sm" id="btnCopyG" data-icon="copy"><span data-i18n="gcode.copy">G-Code kopieren</span></button><button class="btn sm" id="btnSaveG" data-icon="download"><span data-i18n="gcode.save">Als .gcode speichern</span></button></div>
        </div>
      </details>
    </div>
