# Builds Stiftwerk and publishes it on GitHub Pages:
#   index.html – the app (Web Serial needs HTTPS, which Pages provides)
#   demo.html  – the same app with a simulated plotter, to try everything without hardware
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Test
        run: npm test
      - name: Build
        run: python3 build.py --dev
      - name: Assemble site
        run: |
          mkdir -p site
          cp dist/stiftwerk.html site/index.html
          cp dist/stiftwerk.dev.html site/demo.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
